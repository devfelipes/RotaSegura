<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2462eb">
  <title>Configurações do SOS — RotaSegura</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar-blue">
      <a class="icon-btn" href="perfil.html" aria-label="Voltar"><i data-icon="arrow-left" data-size="22"></i></a>
      <h1 class="title">Configurações do SOS</h1>
    </header>

    <div class="content">
      <div class="intro-line"><span class="sq"><i data-icon="siren" data-size="24"></i></span>Defina como pedir ajuda e o que compartilhar em uma emergência.</div>

      <section class="card">
        <h2 class="h3" style="font-size:18px;margin-bottom:6px">Ativação</h2>
        <div class="rows" id="ativacao"></div>
      </section>

      <section class="card">
        <h2 class="h3" style="font-size:18px">Contagem regressiva antes de enviar</h2>
        <p class="muted small" style="margin:10px 0 16px">Você pode cancelar o SOS durante esse tempo.</p>
        <div class="chips grid-3" id="contagem"></div>
      </section>

      <section class="card">
        <h2 class="h3" style="font-size:18px;margin-bottom:6px">Ao acionar</h2>
        <div class="rows" id="acoes"></div>
      </section>

      <button class="btn btn-outline" id="testar" style="color:var(--red-600)"><i data-icon="shield-alert" data-size="20"></i>Testar botão SOS</button>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/negocio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/paginas/config-sos.js"></script>
</body>
</html>
