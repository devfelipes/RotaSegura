<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2a64">
  <title>Cadastro — RotaSegura</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app bg-white">
    <header class="auth-hero">
      <img src="assets/img/logo.png" alt="RotaSegura — Segurança pra quem entrega">
    </header>

    <form class="auth-form" id="form" novalidate>
      <div class="field">
        <label class="field-label" for="email">E-mail</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
      </div>
      <div class="field">
        <label class="field-label" for="cpf">CPF</label>
        <input class="input" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14" required>
      </div>
      <div class="field">
        <label class="field-label" for="senha">Criar senha</label>
        <input class="input" id="senha" name="senha" type="password" autocomplete="new-password" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label class="field-label" for="confirmacao">Digite novamente</label>
        <input class="input" id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary" type="submit" style="margin-top:20px">Cadastrar</button>
      <div style="flex:1"></div>
      <p class="auth-foot">Ja tem uma conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/negocio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/paginas/cadastro.js"></script>
</body>
</html>
