<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2462eb">
  <title>Informações da moto — RotaSegura</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app has-footer">
    <header class="topbar-blue">
      <a class="icon-btn" href="perfil.html" aria-label="Voltar"><i data-icon="arrow-left" data-size="22"></i></a>
      <h1 class="title">Informações da moto</h1>
    </header>

    <form class="content" id="form" novalidate>
      <section class="card form-stack">
        <h2 class="h2" style="margin-bottom:-2px">Dados da moto</h2>
        <div class="field"><label class="field-label" for="modelo">Marca e modelo</label><input class="input" id="modelo" name="modelo" placeholder="Ex.: Honda CG 160 Fan"></div>
        <div class="grid-2">
          <div class="field"><label class="field-label" for="placa">Placa</label><input class="input" id="placa" name="placa" maxlength="8" style="text-transform:uppercase" placeholder="ABC1D23"></div>
          <div class="field"><label class="field-label" for="ano">Ano</label><input class="input" id="ano" name="ano" inputmode="numeric" maxlength="4" placeholder="2024"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label class="field-label" for="cor">Cor</label><input class="input" id="cor" name="cor" placeholder="Preta"></div>
          <div class="field"><label class="field-label" for="cilindrada">Cilindrada</label><input class="input" id="cilindrada" name="cilindrada" placeholder="150cc"></div>
        </div>
        <div class="field"><span class="field-label">Tipo de baú</span><div class="chips grid-3" id="bau"></div></div>
      </section>

      <section class="card">
        <h2 class="h2">Documento CRLV</h2>
        <p class="muted" style="font-size:14px;margin:12px 0 18px">Envie uma foto nítida do documento da sua moto.</p>
        <div class="grid-2" style="gap:12px">
          <label class="btn btn-outline btn-sm" for="crlv-cam" style="font-weight:600"><i data-icon="camera" data-size="20"></i>Tirar foto</label>
          <label class="btn btn-outline btn-sm" for="crlv-gal" style="font-weight:600;white-space:nowrap;font-size:13px;padding:0 8px;gap:6px"><i data-icon="image" data-size="20"></i>Escolher da galeria</label>
        </div>
        <input type="file" id="crlv-cam" accept="image/*" capture="environment" hidden>
        <input type="file" id="crlv-gal" accept="image/*" hidden>
        <div id="crlv" style="margin-top:16px"></div>
      </section>

      <section class="card">
        <h2 class="h2" style="margin-bottom:8px">Equipamentos</h2>
        <div class="rows" id="equip"></div>
      </section>
    </form>

    <div class="footer-bar">
      <button class="btn btn-primary" type="submit" form="form" style="font-weight:500">Salvar alterações</button>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/negocio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/paginas/moto.js"></script>
</body>
</html>
