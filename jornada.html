<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Jornada — RotaSegura</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app bg-white">
    <div class="jornada-map" id="mapa">
      <a href="mapa.html" aria-label="Abrir mapa e rede de apoio" style="display:block;height:100%">
        <img src="assets/img/mapa.png" alt="Mapa da sua região">
      </a>
    </div>

    <section class="jornada-sheet">
      <div class="status-line" id="status"></div>
      <div class="timer-box" role="timer" aria-live="off">
        <div class="lbl">Tempo de trabalho</div>
        <div class="clock" id="relogio">00:00:00</div>
      </div>
      <p class="ready-lbl" id="pronto" hidden>Pronto para começar?</p>
      <div id="botoes" style="display:flex;flex-direction:column;gap:12px"></div>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/negocio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/paginas/jornada.js"></script>
</body>
</html>
