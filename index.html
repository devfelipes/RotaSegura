<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f9fb">
  <title>Início — RotaSegura</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="home-head">
      <p class="eyebrow" id="saudacao">Boas-vindas</p>
      <h1 class="h1">Tela principal</h1>
    </header>

    <div class="content">
      <section class="card summary-card" aria-labelledby="resumo-t">
        <div class="card-row">
          <h2 class="h3" id="resumo-t">Resumo</h2>
          <span class="eyebrow">Hoje</span>
        </div>
        <div class="stat-grid">
          <div class="stat"><span class="lbl">Horas<br>trabalhadas</span><strong class="val" id="horas">0h</strong></div>
          <div class="stat"><span class="lbl">Sessões<br>iniciadas</span><strong class="val" id="sessoes">0</strong></div>
          <div class="stat"><span class="lbl">Pausas</span><strong class="val" id="pausas">0</strong></div>
        </div>
        <a class="link-btn" href="historico.html"><i data-icon="history" data-size="20"></i>Histórico de jornadas</a>
      </section>

      <a class="map-card" href="mapa.html" aria-label="Abrir mapa e rede de apoio">
        <h2 class="h3">Mapa</h2>
        <img src="assets/img/mapa-preview.png" alt="Mapa da região da Av. Paralela, Salvador">
      </a>

      <p class="ready-lbl" id="pronto">Pronto para começar?</p>
      <button class="btn btn-primary" id="acao"><i data-icon="play" data-size="22"></i><span>Iniciar jornada</span></button>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/negocio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/paginas/inicio.js"></script>
</body>
</html>
